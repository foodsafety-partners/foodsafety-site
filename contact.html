<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>お問い合わせ｜食品安全パートナーズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif; background: #eef1f6; margin: 0; padding: 40px 18px; color: #1b2533; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 16px 40px rgba(24,32,48,.18); }
    h1 { margin-top: 0; font-size: 24px; color: #2c567a; text-align: center; border-bottom: 2px solid #eef1f6; padding-bottom: 16px; margin-bottom: 32px; }
    .form-group { margin-bottom: 24px; }
    label { display: block; font-weight: 900; margin-bottom: 8px; font-size: 15px; }
    input, textarea { width: 100%; padding: 16px; border: 1px solid #d9dde6; border-radius: 8px; font-size: 16px; font-weight: 700; box-sizing: border-box; font-family: inherit; }
    button { width: 100%; padding: 18px; background: #e0872a; color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 1000; cursor: pointer; transition: 0.2s ease; }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(224,135,42,.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    #msg { text-align: center; margin-top: 24px; font-weight: 900; font-size: 16px; }
    .back-link { display: block; text-align: center; margin-top: 24px; color: #5a6475; font-weight: 700; text-decoration: none; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>お問い合わせ・無料相談</h1>
    <form id="contactForm">
      <input type="hidden" id="source" name="source" value="お問い合わせページ">
      <div class="form-group">
        <label>貴社名・お名前</label>
        <input type="text" id="company" name="company" placeholder="例：株式会社○○" required>
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="例：info@example.com" required>
      </div>
      <div class="form-group">
        <label style="margin-bottom:12px;">ご興味のある項目（複数選択可）</label>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px;">
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="HACCP" style="width:18px; height:18px; margin:0;"> HACCP</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="JFS-A" style="width:18px; height:18px; margin:0;"> JFS-A</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="JFS-B" style="width:18px; height:18px; margin:0;"> JFS-B</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="JFS-B Plus" style="width:18px; height:18px; margin:0;"> JFS-B Plus</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="JFS-C" style="width:18px; height:18px; margin:0;"> JFS-C</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="ISO22000" style="width:18px; height:18px; margin:0;"> ISO22000</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="FSSC22000" style="width:18px; height:18px; margin:0;"> FSSC22000</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="GMAP(グローバルマーケットプログラム)" style="width:18px; height:18px; margin:0;"> GMAP</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="講習会" style="width:18px; height:18px; margin:0;"> 講習会</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="コンサル" style="width:18px; height:18px; margin:0;"> コンサル</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="内部監査" style="width:18px; height:18px; margin:0;"> 内部監査</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="教育" style="width:18px; height:18px; margin:0;"> 教育</label>
          <label style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" name="interests" value="認証との差分確認" style="width:18px; height:18px; margin:0;"> 差分確認</label>
        </div>
      </div>
      <button type="submit" id="submitBtn">送信する</button>
      <div id="msg"></div>
    </form>
    <a href="javascript:history.back()" class="back-link">元のページへ戻る</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if(params.has('source')) {
      document.getElementById('source').value = params.get('source');
    }

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = '送信処理中...';
      msg.textContent = '';
      
      const formData = new FormData(e.target);
      const interests = formData.getAll('interests').join('、');
      formData.delete('interests');
      formData.append('message', interests || '（選択なし）');
      const urlEncoded = new URLSearchParams(formData).toString();

      try {
        await fetch("https://script.google.com/macros/s/AKfycbwqmt5j5qgxmdEo5RHrUQPQ12-XJpApshuuE0fV8_8_abfe8HOufzx-bPSThWwBsjZaVA/exec", {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: urlEncoded
        });
        
        msg.textContent = '送信が完了しました。担当者よりご連絡いたします。';
        msg.style.color = '#e0872a';
        e.target.reset();
      } catch(err) {
        msg.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
        msg.style.color = '#d9534f';
      }
      btn.disabled = false;
      btn.textContent = '送信する';
    });
  </script>
</body>
</html>
