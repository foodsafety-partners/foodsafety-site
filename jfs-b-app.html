<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JFS-B 適合セルフチェックアプリ｜食品安全パートナーズ</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
    <style>
        :root {
            --ink: #1b2533; --muted: #5a6475; --line: #d9dde6; --accent: #e0872a; --accent2: #2c567a; --soft: #eef1f6;
            --shadow: 0 16px 40px rgba(24, 32, 48, .18); --w: 1180px;
        }
        * { box-sizing: border-box }
        html { scroll-behavior: smooth }
        body { margin: 0; font-family: "Noto Sans JP", sans-serif; background: var(--soft); color: var(--ink); line-height: 1.6; }
        a { color: inherit; text-decoration: none }
        .container { max-width: 900px; margin: 0 auto; padding: 0 18px }
        .header { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .86); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(27, 37, 51, .08) }
        .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 }
        .brand img { height: 38px; width: auto }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 16px 32px; border-radius: 50px; font-weight: 1000; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; font-size: 18px; }
        .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 10px 20px rgba(224, 135, 42, 0.3); }
        .btn.primary:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .hero { padding: 80px 0 60px; text-align: center; background: linear-gradient(135deg, #004a99 0%, #002d5e 100%); color: white; border-radius: 0 0 40px 40px; }
        .hTitle { font-size: 38px; font-weight: 900; line-height: 1.3; margin-bottom: 20px; }
        .hSub { font-size: 18px; opacity: 0.9; margin-bottom: 30px; }
        .section { padding: 60px 0; }
        .sTitle { text-align: center; font-size: 28px; font-weight: 900; margin-bottom: 40px; color: var(--accent2); }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .fCard { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .fIcon { font-size: 40px; margin-bottom: 15px; display: block; }
        .fTitle { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
        .footer { padding: 40px 0; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); background: #fff; }
        @media(max-width:600px) { .hTitle { font-size: 28px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container" style="max-width: var(--w);">
            <div class="nav">
                <a class="brand" href="./index.html"><img src="./assets/img/logo.png" alt="食品安全パートナーズ"></a>
                <a href="./index.html" style="font-size: 14px; font-weight: bold; color: var(--accent2);">← 公式サイト</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hTitle">不適合を見逃さない。<br>JFS-B適合証明を、もっと身近に。</h1>
            <p class="hSub">自組織のJFS-B適合状況をスマホで素早くチェック。<br>現場の「現在地」を可視化し、審査への確かな自信を。</p>
            <https://docs.google.com/forms/d/e/1FAIpQLSek6NzhHN1-bjReNlH0gG4uGo86wUC3xINbPty9rDC2QmsPTQ/viewform?usp=publish-editor>
            <a href="https://docs.google.com/forms/d/e/XXXXX/viewform" class="btn primary">無料でアプリの利用登録をする 📱</a>
        </div>
    </section>

    <section class="section container">
        <h2 class="sTitle">このアプリができること</h2>
        <div class="features">
            <div class="fCard">
                <span class="fIcon">🔍</span>
                <h3 class="fTitle">適合セルフチェック</h3>
                <p>要求事項ごとに適合状況を選択。現場でリアルタイムに判定できます。</p>
            </div>
            <div class="fCard">
                <span class="fIcon">📸</span>
                <h3 class="fTitle">現場証拠を即保存</h3>
                <p>確認した現場の写真をその場で登録。不適合箇所の記録もスムーズです。</p>
            </div>
            <div class="fCard">
                <span class="fIcon">📑</span>
                <h3 class="fTitle">PDFレポート出力</h3>
                <p>チェック結果をPDFで即作成。改善指示や記録としてそのまま使えます。</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            © 食品安全パートナーズ<br>
            <a href="./privacy-policy.html" style="text-decoration: underline;">プライバシーポリシー</a>
        </div>
    </footer>
</body>
</html>
