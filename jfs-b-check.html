<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFS-Bセルフチェックアプリ｜食品安全パートナーズ</title>
    <style>
        :root {
            --primary: #004a99;
            --accent: #e67e22;
            --bg: #f8f9fa;
            --white: #fff;
        }

        body {
            font-family: sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            background: var(--bg);
        }

        header {
            background: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero {
            background: var(--primary);
            color: white;
            padding: 80px 5%;
            text-align: center;
        }

        .cta-button {
            background: var(--accent);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .mockup-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 40px 5%;
        }

        .item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            width: 200px;
        }

        .item.pc {
            width: 350px;
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <a href="./index.html" class="logo">
            <img src="./assets/img/logo.png" alt="Logo" style="height: 35px;">
            <span>食品安全パートナーズ</span>
        </a>
    </header>

    <section class="hero">
        <h1>JFS-Bセルフチェックアプリ</h1>
        <p>スマホで完結する内部監査・現場点検ツール</p>
        <button class="cta-button" onclick="openM()">今すぐ無料で始める</button>
    </section>

    <div class="mockup-grid">
        <div class="item"><img src="./app1.png?v=3" alt="Audit"></div>
        <div class="item"><img src="./app2.png?v=3" alt="Dashboard"></div>
        <div class="item pc"><img src="./app2.png?v=3" alt="PC"></div>
        <div class="item"><img src="./app3.png?v=3" alt="Report"></div>
    </div>

    <div style="padding: 40px 5%; text-align: center; background: #fff;">
        <h2>書籍と連動して学習効率アップ</h2>
        <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
            <a href="https://www.amazon.co.jp/dp/B0DS1Y43H6" target="_blank">
                <img src="./book1.png?v=3" alt="Book1"
                    style="width: 150px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
            </a>
            <a href="https://www.amazon.co.jp/dp/B0GMWP6JP7" target="_blank">
                <img src="./book2.png?v=3" alt="Book2"
                    style="width: 150px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
            </a>
        </div>
    </div>

    <div id="m" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">アプリを始める</h2>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>
            <div style="margin-bottom: 20px; font-size: 0.8rem;">
                <input type="checkbox" id="check">
                プライバシーポリシーに同意する
            </div>
            <button class="submit-btn" onclick="go()">同意してアプリを開く</button>
            <button onclick="closeM()"
                style="margin-top: 10px; background: none; border: none; color: #888; cursor: pointer; width: 100%;">閉じる</button>
        </div>
    </div>

    <script>
        function openM() { document.getElementById('m').style.display = 'flex'; }
        function closeM() { document.getElementById('m').style.display = 'none'; }
        function go() {
            var e = document.getElementById('email').value;
            var c = document.getElementById('check').checked;
            if (!e) { alert('メールアドレスを入力してください'); return; }
            if (!c) { alert('同意のチェックを入れてください'); return; }
            var url = "https://docs.google.com/forms/d/e/1FAIpQLSek6NzhHN1-bjReNlH0gG4uGo86wUC3xINbPty9rDC2QmsPTQ/viewform?usp=pp_url&entry.193868272=" + encodeURIComponent(e) + "&entry.333726573=%E5%90%8C%E6%84%8F%E3%81%97%E3%81%BE%E3%81%99%E3%80%82";
            window.location.href = url;
        }
    </script>
</body>

</html>
